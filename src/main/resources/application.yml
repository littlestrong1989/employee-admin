    time-zone: GMT+8

app:
  jwt:
    # demo only. MUST be overridden via env var APP_JWT_SECRET in production.
    secret: ${APP_JWT_SECRET:ZGVtby1zZWNyZXQta2V5LWZvci1qd3Qtc2lnbmluZy1wbGVhc2UtcmVwbGFjZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==}
    expire-minutes: 120

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.demo.admin: info
